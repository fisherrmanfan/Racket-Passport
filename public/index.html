<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racket Passport — Match</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --border: #262b38; --text: #e6e8ee;
    --muted: #8b90a0; --accent: #4f8cff; --accent-dim: #2c4c8f;
    --ok: #3ecf8e; --err: #ef5a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 40px 24px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 28px; }

  .search-box { position: relative; }
  input#q {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 14px 16px; font-size: 15px; outline: none;
  }
  input#q:focus { border-color: var(--accent); }

  .suggestions {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 10;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; display: none;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 10px 16px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px;
  }
  .suggestion .manu { color: var(--muted); font-size: 12px; }
  .suggestion:hover, .suggestion.active { background: var(--accent-dim); }

  .status { color: var(--muted); font-size: 13px; margin: 14px 2px; min-height: 18px; }
  .status.err { color: var(--err); }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .manu { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; }
  .spec label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  .spec div.val { font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Racket Passport</h1>
  <p class="sub">Type a racket — autocomplete suggests as you go, Enter (or pick a suggestion) shows full specs.</p>

  <div class="search-box">
    <input type="text" id="q" placeholder="e.g. Blade 98, Biomimetic Tour, Pure Drive…" autocomplete="off">
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const input = $('q');
const suggestionsEl = $('suggestions');
const statusEl = $('status');
const resultsEl = $('results');

let suggestions = [];
let activeIndex = -1;
let debounceTimer = null;

const SPEC_FIELDS = [
  ['head_size', 'Head size (sq. in.)'],
  ['length', 'Length (in.)'],
  ['weight_oz', 'Weight (oz)'],
  ['weight_g', 'Weight (g)'],
  ['balance_pts', 'Balance (pts)'],
  ['balance_type', 'Balance type'],
  ['balance_mm', 'Balance (mm)'],
  ['swingweight', 'Swingweight'],
  ['stiffness', 'Stiffness (RA)'],
  ['beam_width', 'Beam width (mm)'],
  ['power_level', 'Power level'],
  ['string_pattern', 'String pattern'],
  ['tension', 'Tension (lbs)'],
  ['composition_clean', 'Composition'],
  ['main_skip_clean', 'Main skip'],
];

function renderSuggestions() {
  if (!suggestions.length) {
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = '';
    return;
  }
  suggestionsEl.innerHTML = suggestions.map((s, i) => `
    <div class="suggestion${i === activeIndex ? ' active' : ''}" data-index="${i}">
      <span>${s.name}</span>
      <span class="manu">${s.manufacturer}</span>
    </div>`).join('');
  suggestionsEl.classList.add('open');
}

function renderResults(rackets) {
  if (!rackets.length) {
    resultsEl.innerHTML = '';
    return;
  }
  resultsEl.innerHTML = rackets.map((r) => `
    <div class="card">
      <h2>${r.name}</h2>
      <p class="manu">${r.manufacturer} &middot; source ${r.source_id}</p>
      <div class="specs">
        ${SPEC_FIELDS.map(([key, label]) => `
          <div class="spec">
            <label>${label}</label>
            <div class="val">${r[key] ?? '—'}</div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

async function fetchSuggestions(q) {
  if (!q) { suggestions = []; activeIndex = -1; renderSuggestions(); return; }
  try {
    const res = await fetch(`/autocomplete?q=${encodeURIComponent(q)}&limit=8`);
    const data = await res.json();
    suggestions = data.suggestions || [];
    activeIndex = -1;
    renderSuggestions();
  } catch (err) {
    // Autocomplete failing shouldn't block typing/search.
    suggestions = [];
    renderSuggestions();
  }
}

async function runMatch(q) {
  if (!q.trim()) return;
  statusEl.textContent = 'Searching…';
  statusEl.className = 'status';
  suggestionsEl.classList.remove('open');
  try {
    const res = await fetch(`/match?q=${encodeURIComponent(q)}&limit=5`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    renderResults(data.rackets);
    statusEl.textContent = data.count
      ? `${data.count} match${data.count === 1 ? '' : 'es'}`
      : 'No matches — try fewer or different words.';
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'status err';
    renderResults([]);
  }
}

input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = input.value;
  debounceTimer = setTimeout(() => fetchSuggestions(q), 150);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (suggestions.length) { activeIndex = (activeIndex + 1) % suggestions.length; renderSuggestions(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (suggestions.length) { activeIndex = (activeIndex - 1 + suggestions.length) % suggestions.length; renderSuggestions(); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && suggestions[activeIndex]) {
      input.value = suggestions[activeIndex].name;
    }
    runMatch(input.value);
  } else if (e.key === 'Escape') {
    suggestions = []; activeIndex = -1; renderSuggestions();
  }
});

suggestionsEl.addEventListener('click', (e) => {
  const el = e.target.closest('.suggestion');
  if (!el) return;
  const s = suggestions[Number(el.dataset.index)];
  input.value = s.name;
  runMatch(s.name);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) { suggestions = []; activeIndex = -1; renderSuggestions(); }
});
</script>
</body>
</html>
